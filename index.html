<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>God's Eye View</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,drag_indicator,east,flare,flight,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,view_in_ar"
      rel="stylesheet"
    />
  </head>
  <body>
    <main
      id="parent-app-shell"
      class="parent-app-shell"
      aria-label="Application modules"
    >
      <header class="parent-app-topbar">
        <div class="parent-app-brand">
          <span
            class="parent-app-logo brand-logo"
            data-logo-gaze
            data-logo-src="/logo.svg"
            aria-hidden="true"
            ><img src="/logo.svg" alt=""
          /></span>
          <span>
            <strong>GOD'S EYE VIEW</strong>
            <small>MODULE COMMAND</small>
          </span>
        </div>
        <div class="parent-app-layout-controls" aria-label="Module layout">
          <label>
            <span>LEFT</span>
            <select id="left-module-select"></select>
          </label>
          <label>
            <span>RIGHT</span>
            <select id="right-module-select"></select>
          </label>
        </div>
      </header>

      <section class="parent-app-split" aria-label="Split module workspace">
        <section
          id="left-module-pane"
          class="module-pane module-pane-left"
        ></section>
        <button
          id="module-splitter"
          class="module-splitter"
          type="button"
          role="separator"
          aria-label="Resize modules"
          aria-orientation="vertical"
          aria-valuemin="25"
          aria-valuemax="75"
          aria-valuenow="50"
        >
          <span class="material-symbols-outlined" aria-hidden="true"
            >drag_indicator</span
          >
        </button>
        <section
          id="right-module-pane"
          class="module-pane module-pane-right"
        ></section>
      </section>
    </main>

    <section
      id="god-eye-module"
      class="module-surface god-eye-module"
      aria-label="God Eye application"
    >
      <!-- gev:template scene-chrome -->

      <!-- gev:template cockpit -->

      <!-- gev:template display-controls -->

      <!-- gev:template command-dock -->

      <!-- gev:template layer-panels -->

      <!-- gev:template context -->

      <!-- gev:template welcome -->

      <!-- gev:template provider-settings -->

      <!-- gev:template hud-loading -->
    </section>

    <section
      id="cctv-watch-module"
      class="module-surface cctv-watch-module"
      aria-label="CCTV watch module"
    >
      <!-- gev:template cctv-watch -->
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
